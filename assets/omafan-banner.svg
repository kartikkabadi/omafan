    <path id="blade" d="M64 57C50 49 44 37 51 27C58 17 76 19 81 31C86 43 76 54 69 61Z"/>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="#101216" stroke="#292c32"/>
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#grid)"/>
  <path d="M0 300H1200" stroke="#e8ba5a" stroke-opacity=".12"/>
  <g transform="translate(62 89) scale(1.4)">
    <circle cx="64" cy="64" r="54" fill="#17191e" stroke="#e8ba5a" stroke-opacity=".25"/>
    <circle cx="64" cy="64" r="46" fill="none" stroke="#e8ba5a" stroke-opacity=".1"/>
