  <g font-family="'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace">
    <text x="284" y="70" fill="#9b9da4" font-size="12" letter-spacing="2">OMARCHY / APPLE SILICON / LINUX</text>
    <text x="278" y="166" fill="#f4f1e9" font-size="88" font-weight="700" letter-spacing="-5">omafan<tspan fill="#e8ba5a">.</tspan></text>
    <text x="284" y="207" fill="#e8ba5a" font-size="22">Your fans. Your settings.</text>
    <text x="284" y="240" fill="#a9abb3" font-size="15">Fan control &amp; thermal monitoring for Apple Silicon on Omarchy.</text>
    <g font-size="11" letter-spacing="1" fill="#d0d1d6">
