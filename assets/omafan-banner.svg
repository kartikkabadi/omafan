<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">omafan — your fans, your settings</title>
  <desc id="desc">Fan control and thermal monitoring for Apple Silicon on Omarchy. Linked and Separate controls. Both settings remembered. Local only.</desc>
  <defs>
